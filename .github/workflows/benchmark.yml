name: Benchmark

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  bench:
    name: Pipeline benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Benchmark base (${{ github.event.pull_request.base.sha }})
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          cargo bench --bench pipeline -- --save-baseline base

      - name: Benchmark this PR (${{ github.event.pull_request.head.sha }})
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          cargo bench --bench pipeline -- --baseline base | tee bench-output.txt

      - name: Comment results on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('bench-output.txt', 'utf8');
            const marker = '<!-- wollok-rs-benchmark -->';
            const body = `${marker}\n### 📊 Benchmark de parsing/compilación/ejecución\n\nCorpus: \`bench/corpus/wollok-rs/\`. Compara este PR contra \`main\` (\`${{ github.event.pull_request.base.sha }}\`). El % de cambio lo calcula \`criterion\` directo, no es una estimación.\n\n<details><summary>Resultado completo</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
